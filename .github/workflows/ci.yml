name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/CHANGELOG.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/CHANGELOG.md'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Run JS actions on Node 24 (Node 20 is deprecated on the runners).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      # esdev.test.json loads the OTF plugin to compile JSX imports. The Rust
      # toolchain is required; the `test` task's cargo build produces the binary.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install esdev
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/ES-Runtime/main/install.sh | bash -s -- --only=esdev
          echo "$HOME/.es-runtime/bin" >> "$GITHUB_PATH"
      - name: Install tsr
        shell: bash
        # Unpinned, so CI tracks the current tsr. The installer drops the binary in
        # ~/.tsr/bin and only *suggests* a PATH entry — non-interactively it just prints
        # one — so the bin dir goes onto PATH explicitly for the later steps.
        run: |
          curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/tsr/main/install.sh | bash
          echo "$HOME/.tsr/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # What `tsr test` runs lives in tasks.toml (Rust + esdev suites).
      - run: tsr test

  # Real-browser tier: esdev builds component harnesses and drives headless Chrome over
  # CDP (docs/HYDRATION.md §5). These probe engine-fidelity paths (custom-element upgrade timing, the
  # real event loop, portal relocation) that the fast esdev tier can't. Separate job so it
  # only pays the browser cost once and runs in parallel with the fast suite.
  e2e:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install esdev
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/ES-Runtime/main/install.sh | bash -s -- --only=esdev
          echo "$HOME/.es-runtime/bin" >> "$GITHUB_PATH"
      # Pin a known-good Chrome and expose its path (ubuntu-latest ships one too, but pinning
      # keeps the run reproducible across runner-image changes).
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install tsr
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/tsr/main/install.sh | bash
          echo "$HOME/.tsr/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Browser e2e (real headless Chrome)
        env:
          # A missing/incorrect binary makes the suites *skip* (exit 0), which would be a false
          # green — so print the version first: a bad path fails the step loudly here.
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          OTFWC_BIN: ${{ github.workspace }}/target/debug/otfwc
        # `tsr test-e2e` runs the web-docs suites. Each declares the
        # `build-compiler` dep that produces OTFWC_BIN, de-duplicated to a single cargo build.
        run: |
          echo "Chrome: $CHROME_BIN"
          "$CHROME_BIN" --version
          tsr test-e2e
