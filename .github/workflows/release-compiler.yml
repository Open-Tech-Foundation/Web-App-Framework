name: Release web-compiler

# Publishes @opentf/web-compiler on its own, separately from the changesets
# monorepo release. Run it manually (Actions -> "Release web-compiler" -> Run
# workflow) after the JS packages have released. It cross-builds the otfwc binary
# for every platform, brotli-compresses them into bin/, and publishes the single
# package as PUBLIC. Self-skips if this version is already on npm, so it's safe to
# re-run.
#
# The package is `private: true` in git ONLY as a guard so the monorepo
# `changeset publish` (release.yml) doesn't ship it binary-less. This job flips it
# off before publishing, so the package ON NPM is public.

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-binaries:
    name: build otfwc (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   bin: otfwc }
          - { platform: linux-arm64,  os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  bin: otfwc, cross: true }
          - { platform: darwin-x64,   os: macos-14,       target: x86_64-apple-darwin,        bin: otfwc }
          - { platform: darwin-arm64, os: macos-14,       target: aarch64-apple-darwin,       bin: otfwc }
          - { platform: win32-x64,    os: windows-latest, target: x86_64-pc-windows-msvc,     bin: otfwc.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install aarch64 linux cross linker
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release -p otfw_cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    name: Publish @opentf/web-compiler
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: .artifacts
      - name: Stage binaries + publish
        working-directory: packages/web-compiler
        run: |
          # Brotli-compress each binary into bin/<platform>/<name>.br (decompressed
          # on install). Uses node's zlib — no CLI dependency on the runner.
          for dir in ../../.artifacts/*/; do
            platform=$(basename "$dir")
            mkdir -p "bin/$platform"
            for f in "$dir"*; do
              node -e 'const z=require("zlib"),fs=require("fs");fs.writeFileSync(process.argv[2],z.brotliCompressSync(fs.readFileSync(process.argv[1]),{params:{[z.constants.BROTLI_PARAM_QUALITY]:11}}))' \
                "$f" "bin/$platform/$(basename "$f").br"
            done
          done
          find bin -type f
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping."
          else
            # Remove the private guard (not `set private=false` — npm pkg set writes
            # the STRING "false", which is truthy and still trips EPRIVATE).
            # --no-workspaces: the repo root is a private workspace, so without it npm
            # runs in workspace mode and skips this package even from its own dir.
            npm pkg delete private --no-workspaces
            npm publish --access public --no-workspaces
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
