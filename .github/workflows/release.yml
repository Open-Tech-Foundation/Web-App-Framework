name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Standard changesets flow: on a normal push it creates/updates the "Version
  # Packages" PR; when that PR is merged it publishes. @opentf/web-compiler is
  # `private` so changesets skips it here (it has no binaries staged yet) — it is
  # published by the gated job below. `published` is true when anything published.
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Only after `release` actually published: cross-build the otfwc binary for each
  # platform and upload it as an artifact. Gated on `published`, so a normal push
  # never triggers these heavy builds.
  build-binaries:
    name: build otfwc (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   bin: otfwc }
          - { platform: linux-arm64,  os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  bin: otfwc, cross: true }
          - { platform: darwin-x64,   os: macos-13,       target: x86_64-apple-darwin,        bin: otfwc }
          - { platform: darwin-arm64, os: macos-14,       target: aarch64-apple-darwin,       bin: otfwc }
          - { platform: win32-x64,    os: windows-latest, target: x86_64-pc-windows-msvc,     bin: otfwc.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 linux cross linker
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release -p otfw_cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  # Stage every binary into the single @opentf/web-compiler package and publish it
  # once (flipping off `private`). Skips if this version is already on npm.
  publish-compiler:
    name: Publish @opentf/web-compiler
    needs: [release, build-binaries]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: .artifacts
      - name: Stage binaries + publish
        working-directory: packages/web-compiler
        run: |
          for dir in ../../.artifacts/*/; do
            platform=$(basename "$dir")
            mkdir -p "bin/$platform"
            cp "$dir"* "bin/$platform/"
            chmod +x "bin/$platform/"* || true
          done
          find bin -type f
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping."
          else
            npm pkg set private=false
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
