name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write  # create tags and GitHub Releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_opentf_web_compiler: ${{ steps.check.outputs.release_opentf_web_compiler }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - id: check
        run: |
          echo "should_release=$(otf-release check --exclude-package @opentf/web-compiler)" >> "$GITHUB_OUTPUT"
          echo "release_opentf_web_compiler=$(otf-release check --package @opentf/web-compiler)" >> "$GITHUB_OUTPUT"

  matrix-opentf-web-compiler:
    needs: [check-release]
    if: needs.check-release.outputs.release_opentf_web_compiler == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - id: set
        run: echo "matrix=$(otf-release matrix --package @opentf/web-compiler)" >> "$GITHUB_OUTPUT"

  build-opentf-web-compiler:
    needs: [check-release, matrix-opentf-web-compiler]
    if: needs.check-release.outputs.release_opentf_web_compiler == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-opentf-web-compiler.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      # Read the pinned packageManager version from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install otf-release
        if: runner.os != 'Windows'
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Install otf-release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: irm https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.ps1 | iex
      - name: Install esdev for binary staging
        if: runner.os != 'Windows'
        shell: bash
        env:
          ESDEV_VERSION: 0.15.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/ES-Runtime/main/install.sh | bash -s -- --only=esdev
          echo "$HOME/.es-runtime/bin" >> "$GITHUB_PATH"
      - name: Install esdev for binary staging
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ESDEV_VERSION: 0.15.0
          ES_RUNTIME_ONLY: esdev
        run: |
          irm https://raw.githubusercontent.com/Open-Tech-Foundation/ES-Runtime/main/install.ps1 | iex
          Join-Path $HOME '.es-runtime/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build @opentf/web-compiler
        run: otf-release build --package @opentf/web-compiler --target ${{ matrix.name }}/${{ matrix.arch }}
      # Temporary: otf-release stages only one binary per npm matrix package.
      # Keep this step when regenerating the workflow until multi-binary support lands.
      - name: Stage search indexer alongside compiler
        shell: bash
        env:
          SEARCH_TARGET_TRIPLE: ${{ matrix.triple }}
          SEARCH_STAGE_AS: ${{ matrix.stage_as }}
          SEARCH_BINARY_EXT: ${{ matrix.ext }}
        run: esdev scripts/stage-search-binary.mjs "$SEARCH_TARGET_TRIPLE" "$SEARCH_STAGE_AS" "$SEARCH_BINARY_EXT"
      - uses: actions/upload-artifact@v4
        with:
          name: opentf-web-compiler-${{ matrix.name }}-${{ matrix.arch }}
          path: .artifacts/@opentf/web-compiler
          if-no-files-found: error

  publish-opentf-web-compiler:
    needs: [check-release, build-opentf-web-compiler]
    if: needs.check-release.outputs.release_opentf_web_compiler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Read the pinned packageManager version from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: opentf-web-compiler-*
          path: .artifacts/@opentf/web-compiler
          merge-multiple: true
      - run: pnpm install --frozen-lockfile
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Publish
        run: otf-release publish --package @opentf/web-compiler --artifacts-dir .artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [check-release, publish-opentf-web-compiler]
    if: >-
      always() &&
      needs.check-release.outputs.should_release == 'true' &&
      needs.publish-opentf-web-compiler.result != 'failure' &&
      needs.publish-opentf-web-compiler.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Read the pinned packageManager version from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Publish
        run: otf-release publish --exclude-package @opentf/web-compiler
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
