name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # 1. Maintain the changesets "Version Packages" PR. No publishing happens here —
  #    publishing is gated below so a normal push never triggers the heavy builds.
  version:
    name: Version PR
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
      - uses: changesets/action@v1
        with:
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Is a release pending? True only when the local @opentf/web-compiler version is
  #    not yet on npm — i.e. right after a Version PR merge bumped it. One cheap
  #    `npm view` call; changesets owns the version number.
  gate:
    name: Release pending?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          name=$(node -p "require('./packages/web-compiler/package.json').name")
          version=$(node -p "require('./packages/web-compiler/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version already published — nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version not on npm — release pending."
          fi

  # 3. Cross-build the otfwc binary for each platform (only on a real release).
  build-binaries:
    name: build otfwc (${{ matrix.platform }})
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   bin: otfwc }
          - { platform: linux-arm64,  os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  bin: otfwc, cross: true }
          - { platform: darwin-x64,   os: macos-13,       target: x86_64-apple-darwin,        bin: otfwc }
          - { platform: darwin-arm64, os: macos-14,       target: aarch64-apple-darwin,       bin: otfwc }
          - { platform: win32-x64,    os: windows-latest, target: x86_64-pc-windows-msvc,     bin: otfwc.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 linux cross linker
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release -p otfw_cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  # 4. Stage every binary into the single @opentf/web-compiler package, then publish
  #    all packages with `changeset publish` (idempotent — only unpublished versions).
  publish:
    name: Publish
    needs: [gate, build-binaries]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: bun install
      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: .artifacts
      - name: Stage binaries into bin/
        run: |
          for dir in .artifacts/*/; do
            platform=$(basename "$dir")
            mkdir -p "packages/web-compiler/bin/$platform"
            cp "$dir"* "packages/web-compiler/bin/$platform/"
            chmod +x "packages/web-compiler/bin/$platform/"* || true
          done
          find packages/web-compiler/bin -type f
      - name: Publish to npm
        run: bun run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
