name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Cross-build the otfwc Rust binary for every supported platform and stage each
  # into its @opentf/otfwc-<platform> package, so the release job can publish them
  # with real binaries. (Without this, the platform packages would publish empty.)
  build-otfwc:
    name: build otfwc (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   bin: otfwc }
          - { platform: linux-arm64,  os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  bin: otfwc, cross: true }
          - { platform: darwin-x64,   os: macos-13,       target: x86_64-apple-darwin,        bin: otfwc }
          - { platform: darwin-arm64, os: macos-14,       target: aarch64-apple-darwin,       bin: otfwc }
          - { platform: win32-x64,    os: windows-latest, target: x86_64-pc-windows-msvc,     bin: otfwc.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 linux cross linker
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release -p otfw_cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: otfwc-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  release:
    name: Release
    needs: build-otfwc
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download otfwc binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage binaries into their platform packages
        run: |
          for d in artifacts/otfwc-*; do
            plat="${d#artifacts/otfwc-}"
            cp "$d"/* "packages/otfwc/npm/$plat/"
            chmod +x "packages/otfwc/npm/$plat/"otfwc* || true
          done

      - name: Install Dependencies
        run: bun install

      - name: Run Tests
        run: bun test

      # Publishes the JS packages and the otfwc binary packages. `bun run release`
      # runs `changeset publish`; binaries are already staged above.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
