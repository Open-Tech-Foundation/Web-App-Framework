name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Runs on every push to main, but only PUBLISHES when a changeset Version PR has
  # been merged (versions bumped). Otherwise it just creates/updates that PR — no
  # publish, no expensive binary builds.
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Only after `release` actually published: cross-build the otfwc binary per
  # platform and publish each @opentf/otfwc-<platform> package (synced to the just-
  # published @opentf/otfwc version). Gated on `published`, so a normal push never
  # triggers these heavy builds.
  publish-otfwc-binaries:
    name: publish otfwc (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   bin: otfwc }
          - { platform: linux-arm64,  os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  bin: otfwc, cross: true }
          - { platform: darwin-x64,   os: macos-13,       target: x86_64-apple-darwin,        bin: otfwc }
          - { platform: darwin-arm64, os: macos-14,       target: aarch64-apple-darwin,       bin: otfwc }
          - { platform: win32-x64,    os: windows-latest, target: x86_64-pc-windows-msvc,     bin: otfwc.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Install aarch64 linux cross linker
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release -p otfw_cli --target ${{ matrix.target }}
      - name: Sync version + stage binary
        shell: bash
        run: |
          node scripts/sync-otfwc-versions.mjs
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "packages/otfwc/npm/${{ matrix.platform }}/${{ matrix.bin }}"
      - name: Publish platform package
        run: npm publish
        working-directory: packages/otfwc/npm/${{ matrix.platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
