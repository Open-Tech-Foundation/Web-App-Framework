[package]
name = "otfw_cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OTF Web — the IR compiler binary (otfwc), invoked by the toolchain. See ARCHITECTURE.md §8."

[[bin]]
name = "otfwc"
path = "src/main.rs"

# Internal static-search indexer. It is deliberately not a separately published
# crate: web-docs is its only product-facing consumer.
[[bin]]
name = "otf-search"
path = "src/search_main.rs"

[dependencies]
otfw_compiler = { workspace = true }
blake3 = "1"
base64 = "0.22"
lol_html = "3.0.1"
serde_json = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
walkdir = "2"
