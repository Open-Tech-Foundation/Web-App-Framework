[package]
name = "otfw_cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OTF Web — the IR compiler binary (otfwc), invoked by the toolchain. See ARCHITECTURE.md §8."

[[bin]]
name = "otfwc"
path = "src/main.rs"

[dependencies]
otfw_compiler = { workspace = true }
blake3 = "1"
base64 = "0.22"
scraper = "0.27"
regex = "1"
serde_json = "1"
unicode-normalization = "0.1"
walkdir = "2"
