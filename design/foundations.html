<!-- @dsCard group="Foundations" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundations — OTF Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --surface: #f8fafc; --text: #0f172a; --muted: #64748b;
    --border: #e2e8f0; --accent: #ff851b; --accent-hover: #e67512;
    --accent-soft: rgba(255,133,27,.1); --radius: 16px;
    --font: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 40px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 16px; font-weight: 700; }
  section { margin-bottom: 40px; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 12px; }
  .swatch { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .swatch .chip { height: 56px; }
  .swatch .meta { padding: 8px 10px; }
  .swatch .name { font-size: 12px; font-weight: 600; }
  .swatch .val { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .type-row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .type-row .label { width: 64px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .scale-7 { font-size: 44px; font-weight: 800; letter-spacing: -.02em; }
  .scale-5 { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .scale-3 { font-size: 20px; font-weight: 600; }
  .scale-base { font-size: 16px; }
  .scale-sm { font-size: 14px; color: var(--muted); }
  .radii { display: flex; gap: 16px; }
  .radii div { width: 72px; height: 72px; background: var(--accent-soft); border: 1px solid var(--accent); }
</style>
</head>
<body>
  <section>
    <h2>Color · Light</h2>
    <div class="swatches">
      <div class="swatch"><div class="chip" style="background:#ffffff;border-bottom:1px solid var(--border)"></div><div class="meta"><div class="name">bg</div><div class="val">#ffffff</div></div></div>
      <div class="swatch"><div class="chip" style="background:#f8fafc"></div><div class="meta"><div class="name">surface</div><div class="val">#f8fafc</div></div></div>
      <div class="swatch"><div class="chip" style="background:#0f172a"></div><div class="meta"><div class="name">text</div><div class="val">#0f172a</div></div></div>
      <div class="swatch"><div class="chip" style="background:#64748b"></div><div class="meta"><div class="name">muted</div><div class="val">#64748b</div></div></div>
      <div class="swatch"><div class="chip" style="background:#ff851b"></div><div class="meta"><div class="name">accent</div><div class="val">#ff851b</div></div></div>
      <div class="swatch"><div class="chip" style="background:#e2e8f0"></div><div class="meta"><div class="name">border</div><div class="val">#e2e8f0</div></div></div>
    </div>
  </section>

  <section>
    <h2>Type · Geist</h2>
    <div class="type-row"><span class="label">7xl/800</span><span class="scale-7">Native-first</span></div>
    <div class="type-row"><span class="label">5xl/700</span><span class="scale-5">Zero-VDOM</span></div>
    <div class="type-row"><span class="label">xl/600</span><span class="scale-3">Compiles JSX to native DOM</span></div>
    <div class="type-row"><span class="label">base</span><span class="scale-base">Built with signals and standard Web Components.</span></div>
    <div class="type-row"><span class="label">sm/muted</span><span class="scale-sm">Indicative benchmark · frame-quantized timer.</span></div>
  </section>

  <section>
    <h2>Radius</h2>
    <div class="radii">
      <div style="border-radius:8px"></div>
      <div style="border-radius:12px"></div>
      <div style="border-radius:16px"></div>
      <div style="border-radius:24px"></div>
    </div>
  </section>
</body>
</html>
