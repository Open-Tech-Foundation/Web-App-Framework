<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Framework | Zero-VDOM SPA Framework</title>
    <link rel="icon" href="/img/otf-logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/otf-logo.svg">
    <link rel="alternate" type="application/rss+xml" title="OTF Web Blog" href="/blog/rss.xml">
    <link rel="alternate" type="application/atom+xml" title="OTF Web Blog" href="/blog/atom.xml">

    <script>
      (function () {
        try {
          // "theme" holds the chosen mode: "light" | "dark" | "system" (or unset).
          // Resolve "system"/unset to the OS preference so the first paint is correct.
          var s = localStorage.getItem("theme");
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/app/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup-templating.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
</head>
<body class="bg-white text-slate-900">
    <!-- The OTF Web toolchain mounts the app here and injects the bundle. -->
    <div id="app"></div>
</body>
</html>
