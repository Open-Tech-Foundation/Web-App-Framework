# tasks.toml — the workspace root anchor and config for `tsr`.
# Docs: https://tsr.opentechf.org/docs
#
# One discoverable entry point for the repo's tasks — `tsr --list` — instead of knowing
# which of the root package.json, a package's own scripts, or a bare cargo/wrangler
# command holds the one you want. CI runs `tsr test` and `tsr test-e2e`, so what is
# defined here is what CI enforces.
#
# Multi-step work is expressed with `deps`, not shell `&&`: each step stays a task you
# can run on its own — `tsr test-e2e-docs-hydration` when debugging that one suite —
# and tsr owns the ordering and the per-step reporting.
#
# `build-compiler` is declared as a dep of every leaf that needs the binary rather than
# listed as a sibling beside them. tsr de-duplicates shared deps (a diamond runs its base
# once) and will not start a task until its own deps finish, so this is what makes
# `parallel = true` safe: as a sibling it would race the tasks that need its output.

[workspace]
members = ["packages/*", "playground", "benchmarks/*", "website"]

# --- develop ------------------------------------------------------------------

# The playground is the framework's own scratch app. Run the linked CLI from the
# repository root: pnpm links its source outside the app's esdev filesystem jail,
# while `--root` keeps the app itself inside the same root sandbox.
[tasks.dev]
run = "esdev packages/web-cli/src/cli.js dev --root=playground --port=3005"

[tasks.site]
run = "esdev packages/web-cli/src/cli.js dev --root=website"

# --- check --------------------------------------------------------------------

[tasks.typecheck]
# Needs the precompiled fixtures on disk: `packages/web/test-entry.js` re-exports
# them, so without `compile-test-fixtures` the import does not resolve.
deps = ["compile-test-fixtures"]
run = "tsc --noEmit"

# The compiler binary, which several suites need on disk: component fixtures are
# precompiled through otfwc ahead of time (see compile-test-fixtures), and the
# e2e drive the real toolchain.
[tasks.build-compiler]
run = "cargo build"

[tasks.test-rust]
deps = ["build-compiler"]
run = "cargo test"

# Runtime-native tests: the CLI, scaffolder, and framework's pure core/server paths.
[tasks.test-esdev]
deps = ["build-compiler"]
run = "esdev test packages/web-cli/tests packages/create-web/tests packages/web/core/reactive.test.js packages/web/core/signals.test.js packages/web/esdev-tests/clsx.test.js packages/web/server/api.test.js packages/web/server/cookies.test.js packages/web/server/head.test.js packages/web/server/loader.test.js packages/web/server/middleware.test.js packages/web/server/render.test.js packages/web/server/ssg-runtime.test.js packages/web/server/adapters/node.test.js"

# DOM suites: these ran under happy-dom's ambient `document` before; under esdev
# the `--dom` realm provides it instead (esdev's URL is http://localhost/, so the
# old `window.happyDOM?.setURL` guards are harmless no-ops). `resource.test.js`
# needs it too — without a `document` the resource thinks it is server-side.
[tasks.test-esdev-dom]
deps = ["build-compiler", "compile-test-fixtures"]
run = "esdev test --dom packages/web/core/errors.test.js packages/web/runtime/lifecycle.test.js packages/web/runtime/resource.test.js packages/web/runtime/clsx.test.js packages/web/runtime/dom.test.js packages/web/runtime/router.test.js packages/web/runtime/router-data.test.js packages/web/runtime/router-hydrate.test.js packages/web/runtime/router-nav.test.js packages/web/runtime/hydrate.e2e.test.js"

# @opentf/esdev-plugin-web: the otfwc compiler service + runtime:build plugin.
# Binary-free (the resolver is fully injectable), so no compiler build needed.
[tasks.test-esdev-plugin]
run = "esdev test packages/esdev-plugin-web/tests"

# @opentf/create-web is deprecated (use `esdev create`); its tests stay until removal.
[tasks.test-create-web]
run = "esdev test tests/scaffold.test.js"
dir = "packages/create-web"

[tasks.test-web-docs]
run = "esdev test packages/web-docs/tests/feed.test.js packages/web-docs/tests/llms.test.js packages/web-docs/tests/search.test.js packages/web-docs/tests/tokenizer.test.js"

# Mounted-component suites (Sidebar drawer / collapse-all): the components are
# otfwc-compiled on import no longer — they come from the precompiled
# *.compiled.js siblings (see compile-test-fixtures), mounted by tag.
[tasks.test-web-docs-dom]
deps = ["build-compiler", "compile-test-fixtures"]
run = "esdev test --dom packages/web-docs/tests/MobileDrawer.test.js packages/web-docs/tests/SidebarCollapseAll.test.js"

[tasks.test-web-form]
deps = ["build-compiler", "compile-test-fixtures"]
run = "esdev test --dom packages/web-form/tests"

# Precompile JSX test fixtures with otfwc: `esdev test` runs files unaltered
# (no bundler plugins), so component fixtures are compiled ahead of time to
# git-ignored *.compiled.js siblings that the test files import.
[tasks.compile-test-fixtures]
deps = ["build-compiler"]
run = "esdev scripts/compile-test-fixtures.mjs"

[tasks.test-web-i18n]
deps = ["build-compiler", "compile-test-fixtures"]
run = "esdev test --dom packages/web-i18n/i18n.test.js"

# Independent processes — cargo and the ES-Runtime — so they overlap.
[tasks.test]
deps = ["test-rust", "test-esdev", "test-esdev-dom", "test-esdev-plugin", "test-web-docs", "test-web-docs-dom"]
parallel = true

# Real-browser tier (docs/HYDRATION.md §5) — drives `otfw serve`/`build` against headless
# Chrome over CDP, covering engine-fidelity paths (custom-element upgrade timing, the real
# event loop, portal relocation) the `--dom` tier can't reach. Slow and browser-dependent,
# so it stays out of `test`.
#
# These stay **sequential** deliberately, unlike `test` and `ci`. Every suite takes its HTTP
# port from the OS (`port: 0`), but the Chrome debugging ports are not that clean: the three
# web-docs suites draw `9000 + random(1000)`, while four web-cli suites hardcode theirs —
# 9333 (hydrate-browser), 9334 (lifecycle-hooks), 9355 (runtime-browser), 9357
# (template-parity). Overlapping the two groups can collide whenever a web-docs suite happens
# to draw a web-cli port, and each suite spawns its own Chrome besides. Flip `parallel` on
# once every suite takes its debugging port from the OS too — the fixed four are the blocker,
# not the random ones.
#
# The web-cli browser suites share one ESdev-native orchestrator.
[tasks.test-e2e-cli]
deps = ["build-compiler"]
run = "esdev tests/e2e/all.mjs"
dir = "packages/web-cli"

[tasks.test-e2e-docs-drawer]
deps = ["build-compiler"]
run = "esdev packages/web-docs/tests/e2e/mobile-drawer.mjs"

[tasks.test-e2e-docs-sidebar]
deps = ["build-compiler"]
run = "esdev packages/web-docs/tests/e2e/sidebar-collapse.mjs"

[tasks.test-e2e-docs-hydration]
deps = ["build-compiler"]
run = "esdev packages/web-docs/tests/e2e/hydration.mjs"

[tasks.test-e2e-docs]
deps = ["test-e2e-docs-drawer", "test-e2e-docs-sidebar", "test-e2e-docs-hydration"]

[tasks.test-e2e]
deps = ["test-e2e-cli", "test-e2e-docs"]

# Local convenience — CI runs the fast and browser tiers as separate parallel jobs, so this
# is the "use my cores" path on a dev machine. `build-compiler` is de-duplicated to one run.
[tasks.ci]
deps = ["typecheck", "test", "test-e2e"]
parallel = true

# --- build --------------------------------------------------------------------

[tasks.build]
run = "esdev packages/web-cli/src/cli.js build --root=playground"

[tasks.site-build]
run = "esdev packages/web-cli/src/cli.js build --root=website --ssg"

# --- benchmarks ---------------------------------------------------------------

# Runtime benchmark (update latency in a real browser). Args pass through:
#   tsr bench -- all           every case, with a comparison table
#   tsr bench -- otfw react    just those two
# See benchmarks/README.md. The SSG build benchmark is a separate, manual procedure —
# benchmarks/ssg-build/README.md.
[tasks.bench]
run = "bun benchmarks/run.mjs"

[tasks.bench-react-build]
run = "bun build.mjs"
dir = "benchmarks/react"

[tasks.bench-react-dev]
run = "bun build.mjs && bun --cwd dist serve"
dir = "benchmarks/react"

[tasks.bench-solid-build]
run = "bun build.mjs"
dir = "benchmarks/solid"

[tasks.bench-svelte-build]
run = "bun build.mjs"
dir = "benchmarks/svelte"

[tasks.bench-otfw-dev]
run = "esdev packages/web-cli/src/cli.js dev --root=benchmarks/otfw --port=3010"

[tasks.bench-otfw-build]
run = "esdev packages/web-cli/src/cli.js build --root=benchmarks/otfw"
